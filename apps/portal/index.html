<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="ENS Explorer App" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-icon-180x180.png" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap"
        />
        <meta name="theme-color" content="#007C20" />
        <title>ENS Explorer App</title>
    </head>

    <body>
        <script>
            ;(() => {
                const stored = localStorage.getItem('ens-portal-theme')
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
                if (stored === 'dark' || ((!stored || stored === 'system') && prefersDark)) {
                    document.documentElement.classList.add('dark')
                }
            })()
        </script>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
