SPECIFICATION Spec

\* Current implementation mapping. This model is expected to produce a
\* counterexample: the view is captured when busy is observed, not atomically
\* with the click, and query-derived start figures are not actor-versioned.
CONSTANTS
  CaptureViewAtClick = FALSE
  HoldViewWhileBusy = TRUE
  LockSelectionAtClick = FALSE
  BindStartMethodToClick = FALSE
  BindStartFiguresToClick = FALSE
  AbortOnActorChange = TRUE

INVARIANT TypeOK
INVARIANT InFlightViewMatchesClick
INVARIANT PendingSelectionIsStable
INVARIANT ChangedActorNeverStarts
INVARIANT StartedPaymentMatchesClick

CHECK_DEADLOCK FALSE
