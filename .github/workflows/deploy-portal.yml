name: Deploy Portal to IPFS

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  deploy:
    if: contains(github.event.release.name, 'portal') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs pnpm (version from `packageManager`), installs Node, restores the
      # pnpm store cache and runs `pnpm install --frozen-lockfile` — all in one step.
      # pnpm/action-setup only supports pnpm <=10, hence the swap.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        env:
          # pnpm/setup exposes no frozen-lockfile input — `require-lockfile` was
          # not one and was silently ignored, leaving the guarantee resting on
          # pnpm defaulting frozen-lockfile to true only when it detects CI.
          # Set it explicitly so a stale lockfile fails the run either way.
          PNPM_CONFIG_FROZEN_LOCKFILE: true
        with:
          runtime: node@lts
          cache: true

      - name: Type check Portal
        run: pnpm typecheck:portal

      - name: Build Portal app
        run: pnpm build:portal

      - name: Verify build output
        run: |
          if [ ! -d "apps/portal/dist" ]; then
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Build verification passed"

      - name: Deploy to IPFS
        id: deploy
        run: |
          echo "🚀 Deploying Portal to IPFS..."
          output=$(pnpm omnipin deploy --ens ${{ vars.PORTAL_ENS }} --safe ${{ vars.PORTAL_SAFE }})
          echo "$output"

          # Extract CID from output
          cid=$(echo "$output" | grep -oP 'Root CID: \K\S+' || echo "")
          if [ -z "$cid" ]; then
            echo "❌ Failed to extract CID from deployment output"
            exit 1
          fi

          echo "✅ Deployment successful!"
          echo "CID=$cid" >> $GITHUB_OUTPUT
          echo "Deployment Output:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **IPFS Gateway URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- dweb.link: https://$cid.ipfs.dweb.link" >> $GITHUB_STEP_SUMMARY
        env:
          OMNIPIN_STORACHA_PROOF: ${{ secrets.OMNIPIN_STORACHA_PROOF }}
          OMNIPIN_STORACHA_TOKEN: ${{ secrets.OMNIPIN_STORACHA_TOKEN }}

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "✅ Portal deployment completed successfully!"
            echo "CID: ${{ steps.deploy.outputs.cid }}"
          else
            echo "❌ Portal deployment failed!"
            exit 1
          fi
