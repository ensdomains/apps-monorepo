name: Biome Code Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  biome:
    name: Biome Linting & Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Biome check with reviewdog
        uses: mongolyy/reviewdog-action-biome@v2
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
