name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request with two goals:
            1) Enforce STYLEGUIDE.md rules.
            2) Catch broader engineering issues (logic bugs, security/privacy risks, performance pitfalls, missing tests, maintainability concerns).

            Priority:
            - Highest: correctness, security, data-loss, and user-impact bugs.
            - Then STYLEGUIDE.md 🔴 Must rules.
            - Then STYLEGUIDE.md 🟡 Default rules (allow justified exceptions).
            - STYLEGUIDE.md 🟢 Guidelines are optional suggestions.

            Review behavior:
            - Leave actionable inline comments only for concrete issues in changed code.
            - Avoid duplicate comments for issues already reported and still unresolved.
            - Include the relevant STYLEGUIDE.md rule when a style rule is violated.
            - Keep comments concise and specific, and suggest a fix when possible.
            - Do not post praise-only inline comments.

            Final summary (sticky comment):
            - Use `gh pr comment` for top-level feedback. Use `mcp__github_inline_comment__create_inline_comment` for inline code issues.
            - Group findings by severity: critical/high, medium, low.
            - Include a short "Styleguide" section and a short "General code quality" section.
            - If no issues are found, clearly say "No blocking issues found".
            - Only post GitHub comments - never approve, request changes, or submit a formal PR review state.

          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
