name: E2E Tests

# Fast PR/push gate: the curated @smoke suite only (~5 min measured, see
# e2e/docs/smoke-suite.md), plus the always-cheap coverage-ledger check. The
# full sharded matrix (manager, manager-premium, manager-migration, portal,
# the V1 shape matrix, metadata) moved to e2e-nightly.yml — it takes hours,
# which is no longer acceptable as a per-push gate. Re-add it here (or widen
# the smoke set) if the smoke suite's regression signal proves insufficient.
on:
  push:
    branches:
      - main
      - ensjs-v2
  pull_request:
    branches:
      - main
      - ensjs-v2
    paths:
      - ".github/workflows/e2e.yml"
      - "apps/manager/**"
      - "apps/portal/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "e2e/**"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The coverage ledger and the harness integrity gates. Cheap (no docker, no
  # browsers) and always runs, because their job is to catch claims that outran
  # the evidence: a scenario tag that is not in the registry, a test skipped
  # without a written EXEMPT, a defect filed with no failing test proving it, a
  # tier's terminal count going down, or a contract address that stopped coming
  # from the config the apps read.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Rule 7 — no contract address literals, and no address bound to two
      # different names. Runs before the reconciler: a suite built on a drifted
      # address produces confident wrong results, so there is no point counting
      # its coverage.
      - name: Harness integrity — address literals
        run: pnpm e2e:check:addresses
      - name: Fail if the generated V1 matrix specs are stale
        run: pnpm --filter @ens-apps/e2e matrix:check
      - name: Reconcile E2E coverage
        run: pnpm e2e:coverage
      - name: Fail if the generated report is stale
        run: |
          if ! git diff --quiet -- e2e/docs/e2e-coverage.md; then
            echo "::error::e2e/docs/e2e-coverage.md is out of date — run 'pnpm e2e:coverage' and commit the result."
            git --no-pager diff -- e2e/docs/e2e-coverage.md
            exit 1
          fi

  # The curated @smoke suite (~5 min measured) across both apps — see
  # e2e/docs/smoke-suite.md for what's in it and why. Runs as one job (not
  # sharded) since the whole point is speed over breadth; the full matrix
  # this replaced lives in e2e-nightly.yml now.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      # ── checkout & toolchain ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        env:
          # pnpm/setup has no frozen-lockfile input; force it via config env.
          PNPM_CONFIG_FROZEN_LOCKFILE: true
        with:
          runtime: node@lts
          cache: true

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm --filter @ens-apps/e2e exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ens-apps/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ens-apps/e2e exec playwright install-deps chromium

      - name: Install Foundry (cast CLI)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── local blockchain stack ────────────────────────────────────
      # The smoke suite spans both apps (see e2e/docs/smoke-suite.md), so
      # unlike the old per-project matrix job this always starts the full
      # service set — mockestrator included, since the manager smoke slice
      # (registration) goes through Rhinestone.
      - name: Start E2E stack
        run: |
          SERVICES="anvil alto paymaster mockestrator"
          echo "Starting: $SERVICES"
          docker compose -f e2e/infra/docker-compose.yml up -d $SERVICES

          echo "Waiting for Anvil..."
          timeout 60 bash -c 'until curl -sf -X POST http://127.0.0.1:8545 \
            -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}" \
            > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Anvil ready"

          echo "Waiting for Alto..."
          timeout 90 bash -c 'until curl -sf -X POST http://127.0.0.1:4337 \
            -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}" \
            > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Alto ready"

          echo "Waiting for Paymaster..."
          timeout 90 bash -c 'until curl -sf -X POST http://127.0.0.1:3002 \
            -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}" \
            > /dev/null 2>&1; do sleep 2; done'
          echo "✅ Paymaster ready"

      # ── write .env from checked-in CI templates ─────────────────
      - name: Copy CI env files
        run: |
          cp apps/manager/.env.ci apps/manager/.env
          cp apps/portal/.env.ci apps/portal/.env
          cp e2e/.env.ci e2e/.env

      # ── fund test accounts ──────────────────────────────────────
      - name: Fund portal test accounts
        run: bash e2e/infra/scripts/fund-account.sh 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266

      - name: Fund Rhinestone smart accounts
        run: |
          bash e2e/infra/scripts/fund-rhinestone-account.sh
          # The manager app runs with VITE_FF_USE_EOA=false in CI (the HCA path;
          # see apps/manager/.env.ci). The registrar still pulls the USDC payment
          # from the connected EOA (Anvil account 0), not the smart account, so
          # fund it too — otherwise the stablecoin payment option stays disabled
          # (insufficient balance) and the registration tests time out on USDC.
          bash e2e/infra/scripts/fund-account.sh 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266

      # ── start both app dev servers ──────────────────────────────────
      - name: Start manager and portal dev servers
        run: |
          DEBUG=vite:deps pnpm --filter manager dev -- --port 3000 > /tmp/manager-dev.log 2>&1 &
          echo "MANAGER_PID=$!" >> "$GITHUB_ENV"
          DEBUG=vite:deps pnpm --filter portal dev -- --port 3001 > /tmp/portal-dev.log 2>&1 &
          echo "PORTAL_PID=$!" >> "$GITHUB_ENV"
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3001 > /dev/null 2>&1; do sleep 2; done'
          echo "✅ manager on :3000, portal on :3001"

      # ── run the curated smoke suite ─────────────────────────────────
      - name: Run E2E smoke suite
        run: |
          pnpm e2e:smoke
          TEST_EXIT=$?
          kill "$MANAGER_PID" "$PORTAL_PID" 2>/dev/null || true
          exit $TEST_EXIT
        env:
          CI: "true"
          MAILINATOR_API_KEY: ${{ secrets.MAILINATOR_API_KEY }}
          TZ: "UTC"

      # ── debug failed tests ─────────────────────────────────────────
      - name: Show failure context
        if: failure()
        run: |
          echo "=== Manager dev server log (last 100 lines) ==="
          tail -100 /tmp/manager-dev.log 2>/dev/null || echo "(no manager dev log)"
          echo ""
          echo "=== Portal dev server log (last 100 lines) ==="
          tail -100 /tmp/portal-dev.log 2>/dev/null || echo "(no portal dev log)"
          echo ""
          echo "=== Docker container status ==="
          docker compose -f e2e/infra/docker-compose.yml ps -a 2>/dev/null || echo "(docker compose not available)"
          echo ""
          echo "=== Anvil container logs (last 50 lines) ==="
          docker compose -f e2e/infra/docker-compose.yml logs --no-color --tail=50 anvil 2>/dev/null || echo "(no anvil logs)"
          echo ""
          echo "=== Error context files ==="
          find e2e/test-results -name 'error-context.md' -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "(none)"
          echo ""
          echo "=== e2e/.env ==="
          cat e2e/.env 2>/dev/null || echo "(missing)"
          echo ""
          echo "=== apps/manager/.env ==="
          cat apps/manager/.env 2>/dev/null || echo "(missing)"
          echo ""
          echo "=== apps/portal/.env ==="
          cat apps/portal/.env 2>/dev/null || echo "(missing)"

      # ── artifacts & cleanup ───────────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-smoke-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

      - name: Upload Docker logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/e2e-docker-logs
          docker compose -f e2e/infra/docker-compose.yml logs --no-color > /tmp/e2e-docker-logs/docker-compose.log 2>&1

      - name: Upload Docker logs artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-smoke-docker-logs
          path: /tmp/e2e-docker-logs/
          retention-days: 7

      - name: Stop E2E stack
        if: always()
        run: docker compose -f e2e/infra/docker-compose.yml down
