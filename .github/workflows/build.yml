name: Build Verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-changed-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fetch all history for change detection
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        env:
          # pnpm/setup has no frozen-lockfile input; force it via config env.
          PNPM_CONFIG_FROZEN_LOCKFILE: true
        with:
          runtime: node@lts
          cache: true

      - name: Determine base ref
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${BASE_REF}" >> $GITHUB_OUTPUT
          else
            echo "ref=origin/main" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed packages
        id: changed
        run: |
          echo "🔍 Detecting changed packages..."
          CHANGED_PACKAGES=$(pnpm --filter="[${{ steps.base.outputs.ref }}]" --filter='!{.}' list --depth=-1 --json | jq -r '.[].name' | tr '\n' ' ')
          echo "Changed packages: $CHANGED_PACKAGES"
          echo "packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT

          # Check if any apps changed
          if echo "$CHANGED_PACKAGES" | grep -q "portal\|manager"; then
            echo "has_apps=true" >> $GITHUB_OUTPUT
          else
            echo "has_apps=false" >> $GITHUB_OUTPUT
          fi

      # See test.yml: widen to the whole workspace when a root-file change
      # selects the root.
      - name: Determine package scope
        env:
          REF: ${{ steps.base.outputs.ref }}
        run: |
          if pnpm --filter="...[$REF]" list --depth=-1 --json \
            | jq -e --arg root "$PWD" 'any(.[]; .path == $root)' > /dev/null; then
            echo "🌐 Root files changed — type checking every workspace package."
            echo "SCOPE=--filter=!{.}" >> "$GITHUB_ENV"
          else
            echo "🎯 Type checking packages changed since $REF and their dependents."
            echo "SCOPE=--filter=...[$REF] --filter=!{.}" >> "$GITHUB_ENV"
          fi

      # `set -f` keeps the glob characters in `$SCOPE` from being expanded
      # against the working tree; the words still split.
      - name: Type check changed packages
        run: |
          echo "🔍 Type checking changed packages and their dependents..."
          set -f
          pnpm $SCOPE --if-present typecheck

      - name: Build changed apps
        if: steps.changed.outputs.has_apps == 'true'
        env:
          VITE_RHINESTONE_API_KEY: ${{ vars.VITE_RHINESTONE_API_KEY }}
        run: |
          echo "🏗️ Building changed apps and dependents..."
          pnpm --filter="...[${{ steps.base.outputs.ref }}]" --filter='!{.}' --if-present build

      - name: Build all apps (fallback)
        if: steps.changed.outputs.has_apps == 'false'
        env:
          VITE_RHINESTONE_API_KEY: ${{ vars.VITE_RHINESTONE_API_KEY }}
        run: |
          echo "🏗️ No apps changed, building all apps..."
          pnpm --filter=portal --filter=manager --if-present build

      - name: Verify build outputs
        run: |
          echo "✅ Verifying build outputs..."

          # Check portal build
          if [ -d "apps/portal/dist" ]; then
            echo "✅ Portal build successful"
            echo "📁 Portal build size: $(du -sh apps/portal/dist | cut -f1)"
          else
            echo "❌ Portal build failed - dist directory not found"
          fi

          # Check manager build
          if [ -d "apps/manager/dist" ]; then
            echo "✅ Manager build successful"
            echo "📁 Manager build size: $(du -sh apps/manager/dist | cut -f1)"
          else
            echo "❌ Manager build failed - dist directory not found"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: build-artifacts
          path: |
            apps/portal/dist/
            apps/manager/dist/
          retention-days: 7
