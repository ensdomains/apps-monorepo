name: Test and Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch all history for change detection
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine base ref
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${BASE_REF}" >> $GITHUB_OUTPUT
          else
            echo "ref=origin/main" >> $GITHUB_OUTPUT
          fi

      # Privy guardrail (Constraint #1): hard-fail if @privy-io/wagmi is ever
      # introduced, or if any vendor package ships a WagmiProvider. Runs on
      # every PR regardless of change detection — the whole point is to catch
      # an accidental reintroduction. See apps/manager/scripts/audit-wagmi-providers.mjs.
      - name: Audit wagmi providers (manager — Privy guardrail)
        run: pnpm --filter manager audit:wagmi-providers

      - name: Type check changed packages
        run: |
          echo "🔍 Type checking changed packages and their dependents..."
          pnpm --filter="...[${{ steps.base.outputs.ref }}]" typecheck

      - name: Run Biome lint on changed files
        run: |
          echo "🔍 Running Biome on changed packages..."
          pnpm --filter="...[${{ steps.base.outputs.ref }}]" --if-present lint

      - name: Run tests with coverage on changed packages
        run: |
          echo "📊 Running coverage tests on changed packages..."
          pnpm --filter="...[${{ steps.base.outputs.ref }}]" test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # TODO: Uncomment when Knip is configured for all packages
      # - name: Run Knip on changed packages
      #   run: |
      #     echo "🧹 Checking for unused code in changed packages..."
      #     pnpm --filter="...[${{ steps.base.outputs.ref }}]" knip --include files,dependencies
