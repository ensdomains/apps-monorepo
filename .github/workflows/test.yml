name: Biome check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Setup Node.js with pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
      - name: Run biome check
        run: pnpm check
      - name: Run tests
        run: pnpm -r test
      - name: Run knip
        run: pnpm knip
