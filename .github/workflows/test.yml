name: Test and Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for change detection
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check changed packages
        run: |
          echo "🔍 Type checking changed packages and their dependents..."
          pnpm --filter="...[origin/main]" typecheck || pnpm -r typecheck

      - name: Run Biome check on changed files
        run: |
          echo "🔍 Running Biome on changed packages..."
          pnpm --filter="...[origin/main]" check || pnpm check

      - name: Run tests on changed packages
        run: |
          echo "🧪 Running tests on changed packages and their dependents..."
          pnpm --filter="...[origin/main]" test || pnpm -r test

      - name: Run tests with coverage on changed packages
        run: |
          echo "📊 Running coverage tests on changed packages..."
          pnpm --filter="...[origin/main]" test:coverage || pnpm -r test:coverage

      - name: Run Knip on changed packages
        run: |
          echo "🧹 Checking for unused code in changed packages..."
          pnpm --filter="...[origin/main]" knip --include files,dependencies || pnpm knip --include files,dependencies
