name: Test and Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fetch all history for change detection
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        env:
          # pnpm/setup has no frozen-lockfile input; force it via config env.
          PNPM_CONFIG_FROZEN_LOCKFILE: true
        with:
          runtime: node@lts
          cache: true

      - name: Determine base ref
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${BASE_REF}" >> $GITHUB_OUTPUT
          else
            echo "ref=origin/main" >> $GITHUB_OUTPUT
          fi

      # A root-file change selects the workspace root, which has none of these
      # scripts, while subtracting only the root would leave nothing selected —
      # so widen to the whole workspace whenever the root is in the selection.
      - name: Determine package scope
        env:
          REF: ${{ steps.base.outputs.ref }}
        run: |
          if pnpm --filter="...[$REF]" list --depth=-1 --json \
            | jq -e --arg root "$PWD" 'any(.[]; .path == $root)' > /dev/null; then
            echo "🌐 Root files changed — scoping checks to every workspace package."
            echo "SCOPE=--filter=!{.}" >> "$GITHUB_ENV"
          else
            echo "🎯 Scoping checks to packages changed since $REF and their dependents."
            echo "SCOPE=--filter=...[$REF] --filter=!{.}" >> "$GITHUB_ENV"
          fi

      # `set -f` keeps the glob characters in `$SCOPE` (`[ref]`, `!{.}`) from
      # being expanded against the working tree; the words still split.
      - name: Type check changed packages
        run: |
          echo "🔍 Type checking changed packages and their dependents..."
          set -f
          pnpm $SCOPE typecheck

      # No `--if-present`: a package without a `lint` script must fail the
      # build, not be skipped. That flag silently green-lit every package
      # except manager/portal (the only two that had the script).
      - name: Run Biome lint on changed packages
        run: |
          echo "🔍 Running Biome on changed packages..."
          set -f
          pnpm $SCOPE lint

      - name: Run tests with coverage on changed packages
        run: |
          echo "📊 Running coverage tests on changed packages..."
          set -f
          pnpm $SCOPE test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # TODO: Uncomment when Knip is configured for all packages
      # - name: Run Knip on changed packages
      #   run: |
      #     echo "🧹 Checking for unused code in changed packages..."
      #     set -f
      #     pnpm $SCOPE knip --include files,dependencies
