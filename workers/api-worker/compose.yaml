services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./.tools/postgres:/var/lib/postgresql/data
      - ./init-pg-uuidv7.sql:/docker-entrypoint-initdb.d/init-pg-uuidv7.sql