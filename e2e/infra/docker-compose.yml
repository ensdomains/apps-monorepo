# Local E2E stack: Anvil (Sepolia fork) + Alto (ERC-4337 bundler) + optional mock paymaster.
# Use when running E2E tests on the fork so the bundler uses the same chain.
#
# Start:   docker compose -f e2e/infra/docker-compose.yml up -d
# Stop:    docker compose -f e2e/infra/docker-compose.yml down
#
# Then set in the app (or .env):
#   VITE_SEPOLIA_RPC_URL=http://127.0.0.1:8545
#   VITE_PIMLICO_BUNDLER_URL=http://localhost:3000/alto  (proxy avoids CORS; see vite.config.ts)
#
# Optional: override fork URL (e.g. for CI)
#   SEPOLIA_FORK_URL=https://ethereum-sepolia-rpc.publicnode.com
#
# Paymaster is optional; host port 3002 to avoid clashing with app.
#
# ── Why some images are pinned by digest ──────────────────────────────────────
# CI runs on throwaway runners, so every job pulls its images fresh. Any service
# left on a moving tag therefore ships a *different build on every run*, and an
# upstream push can turn CI red with no change in this repo.
#
# `ghcr.io/foundry-rs/foundry:latest` is a nightly that upstream rebuilds per
# master commit (the registry carries ~1250 `nightly-<sha>` tags), so `:latest`
# moves several times a day and two CI runs an hour apart can get different
# anvils. A newer nightly breaks the path the mockestrator uses to fill an
# intent: it fills one by impersonating the smart account and firing one
# `eth_sendTransaction` per call in the batch. Measured on a clean fork with
# identical repo code and the same mockestrator image, manager shard 3/3:
#
#   anvil 1.7.1            (the pin below)  — all 6 calls mined, 3/3 tests pass
#   anvil 1.8.0-nightly    (56b854e401f5748989d346f0aea871bac5d3e266,
#                           `:latest` on 2026-08-12) — only the first 3 calls
#                           mined; calls 4-6 were handed a transaction hash and
#                           then dropped (unknown to the node, empty txpool,
#                           funded account, negligible base fee, no error
#                           anywhere), and the test hung
#
# The mockestrator still reports the intent COMPLETED, carrying the last call's
# hash, so the app waits forever for a receipt that will never exist and the
# registration flow parks on "Waiting for the registration transaction". That is
# what made `registration.spec.ts` "registers a name after connecting from the
# pricing page" fail intermittently from 2026-08-06 onwards: the outcome tracked
# whichever nightly the runner happened to pull, which is why no commit bisects
# it. Which anvil release first regressed this was not bisected.
#
# Anvil and the mockestrator are therefore pinned to digests verified green.
# Alto, the paymaster and Panoptes are deliberately left on moving tags for now:
# the standalone-HCA path does not route through the bundler or paymaster, and
# CI mocks the indexer (E2E_MOCK_INDEXER=true). Pin them too if they ever drift.
#
# To bump a pin:
#   1. docker pull <image>:<tag>
#   2. docker inspect --format '{{index .RepoDigests 0}}' <image>:<tag>
#      (that is the multi-arch index digest — it works on CI amd64 and arm64 dev
#      machines alike; do NOT use a per-architecture manifest digest)
#   3. Put the digest below, run the manager E2E shards locally, and record the
#      resolved version in the trailing comment so the pin stays legible.

services:
  anvil:
    # anvil 1.7.1 (Commit SHA 4072e48705af9d93e3c0f6e29e93b5e9a40caed8).
    # Do not move this to `:latest` — see the note above.
    image: ghcr.io/foundry-rs/foundry@sha256:8347b728d5d393dac1c018691b36f506d23b9dcd78341d40ea0fcb11c3a19cdd
    networks:
      e2e:
        aliases:
          - anvil
    # The Foundry image entrypoint is "/bin/sh -c" which swallows list-style
    # command args.  Override to call anvil directly so all flags are passed.
    entrypoint: ["anvil"]
    command:
      - --fork-url
      - ${SEPOLIA_FORK_URL:-https://lb.drpc.live/sepolia/AnmpasF2C0JBqeAEzxVO8aTDnH6wviUR8JD3QmlfqV1j}
      - --chain-id
      - "11155111"
      - --port
      - "8545"
      - --host
      - "0.0.0.0"
      # The upstream fork RPC drops connections, and anvil PANICS (exit 133) when a
      # storage read fails after its default 5 retries — twice in 45 minutes on
      # 2026-09-10, each time taking every later test with it. More headroom.
      - --retries
      - '20'
      - --timeout
      - '120000'
      - --fork-retry-backoff
      - '2000'
      # safe = latest - 1024 and finalized = latest - 2048 (default 32 / 64).
      # bigname treats a finalized block that disappears as fatal, so this has
      # to stay deeper than any evm_revert a test does.
      - --slots-in-an-epoch
      - '1024'
    ports:
      - "8545:8545"
    healthcheck:
      # eth_chainId ensures RPC is ready for Alto; start_period gives fork time to init
      test: ["CMD", "cast", "rpc", "eth_chainId"]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 20s

  # Read-only Mainnet fork — only for the "metadata" project's mainnet-v1
  # scenarios (WEB-1191). Nothing registers or writes here: mainnet v1 names
  # used in those tests are real, already-registered names, so this fork only
  # needs to serve reads at a pinned block for determinism.
  anvil-mainnet:
    image: ghcr.io/foundry-rs/foundry@sha256:8347b728d5d393dac1c018691b36f506d23b9dcd78341d40ea0fcb11c3a19cdd
    networks:
      e2e:
        aliases:
          - anvil-mainnet
    entrypoint: ["anvil"]
    command:
      - --fork-url
      - ${MAINNET_FORK_URL:-https://ethereum-rpc.publicnode.com}
      - --chain-id
      - "1"
      - --port
      - "8546"
      - --host
      - "0.0.0.0"
    ports:
      - "8546:8546"
    healthcheck:
      # cast defaults to :8545 with no --rpc-url; this fork listens on :8546.
      test: ["CMD", "cast", "rpc", "eth_chainId", "--rpc-url", "http://127.0.0.1:8546"]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 20s

  alto:
    image: ghcr.io/pimlicolabs/alto:latest
    networks:
      e2e:
        aliases:
          - alto
    ports:
      - "4337:4337"
    entrypoint: ["sh", "-c"]
    environment:
      ANVIL_RPC: http://anvil:8545
    command:
      - "node /app/wait-for-anvil.mjs && exec node src/lib/cli/alto.js run --config /app/alto-config.json"
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      - ./alto/alto-config.json:/app/alto-config.json
      - ./alto/wait-for-anvil.mjs:/app/wait-for-anvil.mjs
      - ./alto/healthcheck.mjs:/app/healthcheck.mjs
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Mock verifying paymaster: sponsors gas on the fork (no ETH needed in smart account).
  # Resolve hostname "anvil" to host so any anvil:8545 request (env or lib fallback) hits host's published port.
  paymaster:
    image: ghcr.io/pimlicolabs/mock-verifying-paymaster:main
    networks:
      e2e:
        aliases:
          - paymaster
    ports:
      - "3002:3000"
    environment:
      ALTO_RPC: http://alto:4337
      ANVIL_RPC: http://anvil:8545
    depends_on:
      anvil:
        condition: service_healthy
      alto:
        condition: service_healthy
    restart: on-failure

  # Panoptes ENS Indexer: indexes ENS V2 events from the Anvil fork.
  # Provides a GraphQL API on port 5655 for domain lookups, dashboard, etc.
  panoptes-indexer:
    image: ghcr.io/mdtanrikulu/panoptes:latest
    networks:
      e2e:
        aliases:
          - panoptes-indexer
    command: ["/app/ensv2-indexer-v2"]
    volumes:
      - panoptes-data:/app/data
      - ${PANOPTES_CONTRACTS_FILE:-./panoptes/contracts.json}:/app/config/contracts.json:ro
    environment:
      - DATABASE_PATH=/app/data/ens_v2.db
      - RAINBOW_PATH=/app/data/ens_rainbow.db
      - RPC_URL=http://anvil:8545
      - NETWORK=sepolia
      - CONTRACTS_PATH=/app/config/contracts.json
      - BATCH_SIZE=10000
      - POLL_INTERVAL=2
      - RATE_LIMIT_PER_SECOND=100
      - STATUS_PORT=3001
      - WEBHOOKS_ENABLED=false
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      # The image's own /app/healthcheck.sh probes "localhost", which
      # resolves to the IPv6 loopback ([::1]) first inside this container;
      # the status server only binds IPv4, so the baked-in script reports
      # unhealthy even mid-sync while genuinely serving requests. Bypass it
      # with an explicit IPv4 address instead (mirrors its own marker-file
      # check for a still-downloading rainbow table). Panoptes is on a
      # moving tag (see the file header), so re-check this if the image
      # changes its status port or path.
      test: ["CMD-SHELL", "test -f /app/data/.rainbow_downloading || wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: on-failure

  # A local stand-in for the ENS V1 subgraph, indexing the fork's own logs.
  #
  # The public v1-graphql.ens.dev cannot see anything this suite creates — every
  # seeded name lives on a fork that diverged from Sepolia minutes ago — so
  # without this the Subnames tab, text-record key discovery and name history
  # all render confident negatives locally. See packages/v1-subgraph-shim.
  v1-subgraph:
    build:
      context: ../../packages/v1-subgraph-shim
    networks:
      e2e:
        aliases:
          - v1-subgraph
    ports:
      - "5656:5656"
    environment:
      - PORT=5656
      # Inside the compose network Anvil is reachable by service name; the apps
      # reach this service from the host on 127.0.0.1:5656.
      - RPC_URL=http://anvil:8545
    depends_on:
      anvil:
        condition: service_healthy
    restart: on-failure

  panoptes-api:
    image: ghcr.io/mdtanrikulu/panoptes:latest
    networks:
      e2e:
        aliases:
          - panoptes-api
    command: ["/app/api-entrypoint.sh"]
    ports:
      - "5655:5655"
    volumes:
      - panoptes-data:/app/data:ro
      - ${PANOPTES_CONTRACTS_FILE:-./panoptes/contracts.json}:/app/config/contracts.json:ro
    environment:
      - DATABASE_PATH=/app/data/ens_v2.db
      - RAINBOW_PATH=/app/data/ens_rainbow.db
      - DOWNLOAD_RAINBOW=false
      - NETWORK=sepolia
      - CONTRACTS_PATH=/app/config/contracts.json
      - RPC_URL=http://anvil:8545
      - API_PORT=5655
      - GRAPHQL_MAX_DEPTH=10
      - GRAPHQL_MAX_COST=1000
      - WEBHOOKS_ENABLED=false
      - METRICS_ENABLED=false
    depends_on:
      - panoptes-indexer
    healthcheck:
      # Same IPv6-vs-IPv4 issue as panoptes-indexer's healthcheck above, plus
      # this API build has no /health route at all (confirmed: a 404, not a
      # connection error) — /graphql is the one route guaranteed to be live
      # whenever the server is actually serving.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5655/graphql"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure

  # ── bigname: the indexer the manager reads ────────────────────────────────
  # The manager reads every name from bigname (#1324); the portal still reads
  # Panoptes above. bigname is hosted only, so this runs it against the fork:
  # Postgres, a one-shot schema + read-only role init, the phase-runner that
  # follows Anvil, and the REST API on 127.0.0.1:5660.
  #
  # Opt-in (profile "bigname") because the image is a local build of the
  # bigname repo carrying a dev-only patch that lets a Sepolia source start
  # after block 0 (see e2e/infra/bigname/README.md). start-local-env.sh turns
  # the profile on when the image exists. CI does not run it and mocks the
  # manager's bigname reads instead (E2E_MOCK_INDEXER=true).
  bigname-postgres:
    image: postgres:16-alpine
    profiles: ["bigname"]
    networks:
      e2e:
        aliases:
          - bigname-postgres
    environment:
      - POSTGRES_DB=bigname
      - POSTGRES_USER=bigname
      - POSTGRES_PASSWORD=bigname
    # bigname's own compose file sizes Postgres for a server; this is a test
    # database a few hundred MB in size.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    ports:
      - "5661:5432"
    volumes:
      - bigname-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigname -d bigname"]
      interval: 2s
      timeout: 5s
      retries: 30

  bigname-init:
    image: ${BIGNAME_IMAGE:-bigname:e2e-anvil-fork}
    pull_policy: never
    profiles: ["bigname"]
    networks:
      e2e:
    environment:
      - BIGNAME_DATABASE_URL=postgresql://bigname:bigname@bigname-postgres:5432/bigname
    # init-schema refuses a non-empty schema, so skip it once the schema exists:
    # the database is wiped with every new fork (start-local-env.sh), and a plain
    # restart keeps what the runner already indexed.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if phase-runner init-schema; then echo "[bigname] schema created"; else
          echo "[bigname] init-schema refused; assuming the schema already exists"; fi
    depends_on:
      bigname-postgres:
        condition: service_healthy

  bigname-roles:
    image: postgres:16-alpine
    profiles: ["bigname"]
    networks:
      e2e:
    environment:
      - PGPASSWORD=bigname
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "bigname-postgres", "-U", "bigname", "-d", "bigname", "-f", "/roles.sql"]
    volumes:
      - ./bigname/roles.sql:/roles.sql:ro
    depends_on:
      bigname-init:
        condition: service_completed_successfully

  # Fork-aware RPC for the runner: reads at or below the fork block go straight
  # to the upstream Sepolia RPC, the rest to Anvil. Without it the runner's
  # backfill floods Anvil and stalls every other client (see fork-rpc.mjs).
  bigname-rpc:
    image: node:22-alpine
    profiles: ["bigname"]
    networks:
      e2e:
        aliases:
          - bigname-rpc
    command: ["node", "/fork-rpc.mjs"]
    volumes:
      - ./bigname/fork-rpc.mjs:/fork-rpc.mjs:ro
    environment:
      - PORT=8547
      - ANVIL_RPC_URL=http://anvil:8545
      # Its own override: bigname's startup check and backfill read old headers
      # (down to genesis), which a pruned provider that is fine for Anvil's
      # fork cannot serve. Falls back to the fork URL.
      - UPSTREAM_RPC_URL=${BIGNAME_UPSTREAM_RPC_URL:-${SEPOLIA_FORK_URL:-https://lb.drpc.live/sepolia/AnmpasF2C0JBqeAEzxVO8aTDnH6wviUR8JD3QmlfqV1j}}
    depends_on:
      anvil:
        condition: service_healthy
    restart: on-failure

  bigname-runner:
    image: ${BIGNAME_IMAGE:-bigname:e2e-anvil-fork}
    pull_policy: never
    profiles: ["bigname"]
    networks:
      e2e:
    entrypoint: ["sh", "/runner.sh"]
    volumes:
      - ./bigname/runner.sh:/runner.sh:ro
    environment:
      - BIGNAME_DEV_ALLOW_SEPOLIA_START=1
      - BIGNAME_START=${BIGNAME_START:-fork}
      - ANVIL_SLOTS_IN_AN_EPOCH=1024
      - ANVIL_RPC_URL=http://anvil:8545
      - SOURCE_RPC_URL=http://bigname-rpc:8547
      - BIGNAME_DATABASE_URL=postgresql://bigname:bigname@bigname-postgres:5432/bigname
      - BIGNAME_PHASE_RUNNER_VERIFICATION_DATABASE_URL=postgresql://bigname_verify:bigname_verify@bigname-postgres:5432/bigname
      - BIGNAME_PHASE_RUNNER_MANIFESTS_ROOT=/app/manifests/sepolia
      - BIGNAME_PHASE_RUNNER_CHAINS=ethereum-sepolia
      - BIGNAME_PHASE_RUNNER_LIVE_POLL_MS=500
      - RUST_LOG=info
    depends_on:
      anvil:
        condition: service_healthy
      bigname-roles:
        condition: service_completed_successfully
      bigname-rpc:
        condition: service_started
    restart: on-failure

  bigname-api:
    image: ${BIGNAME_IMAGE:-bigname:e2e-anvil-fork}
    pull_policy: never
    profiles: ["bigname"]
    networks:
      e2e:
        aliases:
          - bigname-api
    command: ["api"]
    ports:
      - "5660:3000"
    environment:
      - BIGNAME_DATABASE_URL=postgresql://bigname_verify:bigname_verify@bigname-postgres:5432/bigname
      - BIGNAME_API_BIND_ADDR=0.0.0.0:3000
      # Through the fork-aware router, like the runner: the API's startup check
      # reads the genesis block, which Anvil can only answer by asking its own
      # upstream, and a pruned fork provider (fine for Anvil) has no genesis.
      - BIGNAME_API_CHAIN_RPC_URLS=ethereum-sepolia=http://bigname-rpc:8547
      # The publication can trail the stored head by a few blocks while a burst
      # of test transactions is projected; serve it rather than 409 stale.
      - BIGNAME_API_PUBLICATION_LAG_TOLERANCE_BLOCKS=16
      - RUST_LOG=info
    depends_on:
      bigname-roles:
        condition: service_completed_successfully
      bigname-rpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  # ENS Metadata Service V2 (github.com/ensdomains/metadata-service-v2), run
  # locally against the anvil forks above — for the "metadata" e2e project
  # (WEB-1191). RPCs point at anvil/anvil-mainnet; the ENSNODE_* indexer URLs
  # deliberately point nowhere reachable — there is no local indexer speaking
  # the zigens/ENSNode dialect this service expects (panoptes-indexer above is
  # a different, incompatible schema), so every scenario exercises the
  # service's own live-on-chain-fallback classification path instead
  # (src/services/metadata.ts statusFromSource, already covered by that repo's
  # own fallback.test.ts / outage-taxonomy.test.ts — this is intended,
  # resilience-tested behaviour, not a workaround).
  metadata-service:
    build:
      context: .
      dockerfile: Dockerfile.metadata-service
      # metadata-service-v2 is private; the clone inside the build needs a
      # credential. Passed as a secret so it never reaches an image layer.
      secrets:
        - gh_token
    networks:
      e2e:
        aliases:
          - metadata-service
    ports:
      - "8787:8787"
    environment:
      - MAINNET_RPC_URL=http://anvil-mainnet:8546
      - SEPOLIA_RPC_URL=http://anvil:8545
      - ENSNODE_MAINNET_URL=http://indexer.invalid/subgraph
      - ENSNODE_SEPOLIA_V2_URL=http://indexer.invalid/graphql
      - ENSNODE_SEPOLIA_V1_URL=http://indexer.invalid/subgraph
      # Real HMAC secret (not WEBHOOK_ALLOW_UNAUTHENTICATED) so the webhook's
      # auth path — the thing MD6 actually tests — stays exercised for real.
      # Must match fixtures/metadataWebhook.ts's DEFAULT_WEBHOOK_SECRET.
      - WEBHOOK_SECRET=${METADATA_SERVICE_WEBHOOK_SECRET:-e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0}
      - RATE_LIMIT_DISABLED=true
    depends_on:
      anvil:
        condition: service_healthy
      anvil-mainnet:
        condition: service_healthy
    healthcheck:
      # /health always returns HTTP 200 (degraded status is reported in the
      # body, not the status code — see src/index.ts) so this only confirms
      # the worker itself is up, not that its dependencies are healthy.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: on-failure

  # Rhinestone mockestrator: local orchestrator for Rhinestone intent-based transactions.
  # Only needed when running the standalone-HCA e2e tests (VITE_FF_USE_EOA=false).
  mockestrator:
    # ENS fork of the Rhinestone mockestrator, pinned so the orchestrator stand-in
    # cannot drift underneath the patched @rhinestone/sdk. This digest is the
    # build `:latest` has resolved to since 2026-06-07, so pinning it is a no-op
    # today and only stops a future push from silently changing CI.
    image: ghcr.io/ensdomains/mockestrator@sha256:d30d9328d774e15a77f107e02733379078b1806d72598d4ffa151d8b507550ba
    networks:
      e2e:
        aliases:
          - mockestrator
    ports:
      - "3007:3000"
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      - ./mockestrator/rpcs.json:/app/rpcs.json
      - ./mockestrator/chains.json:/app/chains.json
    restart: on-failure
    healthcheck:
      # nc is available in the Bun-based image; curl is not. We send a real
      # HTTP request so the check only passes once the HTTP server responds,
      # not just when the TCP port is open.
      test: ["CMD-SHELL", "printf 'GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' | nc -w 2 localhost 3000 | grep -q 'HTTP'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # DQA overlay service (packages/dqa-server): design-review comments pinned to
  # live pages, live cursors, "Sign in with Linear" + push-to-Linear.
  # Apps opt in at build time with VITE_DQA=1 + VITE_DQA_URL=http://localhost:4000
  # (QA / PR previews only — never production). See e2e/docs/dqa-overlay.md.
  # With no LINEAR_* env set it runs in dev mode (local sign-in, dry-run pushes).
  dqa:
    build:
      context: ../../packages/dqa-server
    networks:
      e2e:
        aliases:
          - dqa
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - LINEAR_CLIENT_ID=${LINEAR_CLIENT_ID:-}
      - LINEAR_CLIENT_SECRET=${LINEAR_CLIENT_SECRET:-}
      - LINEAR_REDIRECT_URI=${LINEAR_REDIRECT_URI:-http://localhost:4000/auth/callback}
      # `write` is required for screenshot uploads (fileUpload) and creating
      # sub-issues/triage issues — `comments:create` alone is not enough.
      - LINEAR_SCOPES=${LINEAR_SCOPES:-read,write}
      - LINEAR_ACTOR=${LINEAR_ACTOR:-user}
      - LINEAR_WORKSPACE_ID=${LINEAR_WORKSPACE_ID:-}
      - LINEAR_ALLOWED_TEAM_IDS=${LINEAR_ALLOWED_TEAM_IDS:-}
      - LINEAR_ALLOWED_PROJECT_IDS=${LINEAR_ALLOWED_PROJECT_IDS:-}
      - SESSION_SECRET=${DQA_SESSION_SECRET:-}
      - TOKEN_ENCRYPTION_KEY=${DQA_TOKEN_ENCRYPTION_KEY:-}
      - DQA_DEV_AUTH=${DQA_DEV_AUTH:-false}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID:-}
      - LINEAR_LABEL_ID=${LINEAR_LABEL_ID:-}
      - LINEAR_DRY_RUN=${LINEAR_DRY_RUN:-true}
    volumes:
      - dqa-data:/app/data
      # Live-mount static assets (overlay.js) so local edits don't require an
      # image rebuild. Server code changes still need: up -d --build dqa
      - ../../packages/dqa-server/public:/app/public:ro
    restart: on-failure
    healthcheck:
      # Same IPv6-vs-IPv4 "localhost" issue as the panoptes healthchecks
      # above — this image's loopback resolves [::1] first and the server
      # only binds IPv4, so the probe never connects even though the server
      # is up (confirmed: /auth/config answers fine over 127.0.0.1).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/auth/config"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Build-time credential for the private metadata-service-v2 clone. Sourced from
# the environment so nothing is written to disk:
#   GH_TOKEN=$(gh auth token) docker compose up -d metadata-service
secrets:
  gh_token:
    environment: GH_TOKEN

volumes:
  panoptes-data:
    driver: local
  bigname-data:
    driver: local
  dqa-data:
    driver: local

networks:
  e2e:
    name: ens-e2e
