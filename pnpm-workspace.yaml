packages:
  - apps/*
  - packages/*
  - workers/*
  - e2e

autoInstallPeers: false

catalog:
  "@ensdomains/ensjs": "https://pkg.pr.new/ensdomains/ensjs/@ensdomains/ensjs@252068c"
  "@ensdomains/ensjs-abi": "https://pkg.pr.new/ensdomains/ensjs/@ensdomains/ensjs-abi@252068c"
  xstate: ^5.24.0
  typescript: ^7.0.2
  vite: ^8.0.10
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  happy-dom: ^20.13.2
  "@cloudflare/vite-plugin": ^1.54.2
  wrangler: ^4.127.1
  posthog-js: ^1.398.3
  "@posthog/react": ^1.10.3
  # Exact, not a range: @privy-io/react-auth depends on viem 2.56.0 directly and
  # its sub-packages peer on that exact version, so any other spec here puts a
  # second viem in the tree alongside the app's.
  viem: 2.56.0
  "@rhinestone/sdk": 1.8.0
  # Optional peer dep of @wagmi/connectors (walletConnect connector). Since wagmi
  # v3 all connector deps are optional peers, and autoInstallPeers is false, so it
  # must be declared explicitly or the prod bundle fails to resolve it at runtime.
  "@walletconnect/ethereum-provider": ~2.21.1
  # wagmi pins @wagmi/core and @wagmi/connectors to exact versions, so these
  # three only ever move together — bumping one alone just re-duplicates the
  # tree at wagmi's pinned version.
  wagmi: ^3.7.7
  "@wagmi/core": ^3.6.5
  "@wagmi/connectors": ^8.2.0

dedupeDirectDeps: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@ensdomains/ensjs"
  - "@ensdomains/ensjs-abi"

# Only add entries here if absolutely necessary. To bypass the minimum release age for a specific package, you can temporarily include it below, run install, and then remove it.
# Note: `minimumReleaseAgeExclude` is used solely for checking new package versions.
# Once a package is added to the lockfile, it remains allowed even if newer than the minimum release age.
# minimumReleaseAgeExclude:

resolutionMode: highest

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 1 week

trustPolicyExclude:
  - "@ensdomains/ensjs"
  - "@ensdomains/ensjs-abi"
