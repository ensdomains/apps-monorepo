packages:
  - apps/*
  - packages/*
  - workers/*
  - e2e

autoInstallPeers: false

catalog:
  '@cloudflare/vite-plugin': ^1.33.1
  '@ensdomains/ensjs': https://pkg.pr.new/ensdomains/ensjs/@ensdomains/ensjs@1b5a991
  '@ensdomains/ensjs-abi': https://pkg.pr.new/ensdomains/ensjs/@ensdomains/ensjs-abi@1b5a991
  '@posthog/react': ^1.10.3
  '@rhinestone/sdk': 1.8.0
  '@typescript/native-preview': 7.0.0-dev.20260421.2
  '@wagmi/connectors': ^7.1.1
  '@wagmi/core': ^3.0.0
  '@walletconnect/ethereum-provider': ~2.21.1
  posthog-js: ^1.398.3
  viem: ^2.52.2
  vite: ^8.0.10
  vitest: ^4.1.5
  wagmi: ^3.0.2
  wrangler: ^4.51.0
  xstate: ^5.24.0

catalogs:
  typescript6:
    typescript: ^6.0.3

dedupeDirectDeps: true

minimumReleaseAge: 1440

# Only add entries here if absolutely necessary. To bypass the minimum release age for a specific package, you can temporarily include it below, run install, and then remove it.
# Note: `minimumReleaseAgeExclude` is used solely for checking new package versions.
# Once a package is added to the lockfile, it remains allowed even if newer than the minimum release age.
# minimumReleaseAgeExclude:
minimumReleaseAgeExclude:
  - '@ensdomains/ensjs'
  - '@ensdomains/ensjs-abi'

resolutionMode: highest

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@ensdomains/ensjs'
  - '@ensdomains/ensjs-abi'

trustPolicyIgnoreAfter: 10080 # 1 week
