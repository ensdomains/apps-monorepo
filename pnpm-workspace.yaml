packages:
  - apps/*
  - packages/*
  - workers/*
  - e2e

autoInstallPeers: false

catalog:
  "@ensdomains/ensjs": "https://pkg.pr.new/ensdomains/ensjs/@ensdomains/ensjs@44235af"
  "@ensdomains/ensjs-abi": "https://pkg.pr.new/ensdomains/ensjs/@ensdomains/ensjs-abi@44235af"
  xstate: ^5.24.0
  typescript: ^7.0.2
  vite: ^8.0.10
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  happy-dom: ^20.13.2
  "@cloudflare/vite-plugin": ^1.54.2
  wrangler: ^4.127.1
  posthog-js: ^1.398.3
  "@posthog/react": ^1.10.3
  viem: ^2.52.2
  "@rhinestone/sdk": 1.8.0
  # Optional peer dep of @wagmi/connectors (walletConnect connector). Since wagmi
  # v3 all connector deps are optional peers, and autoInstallPeers is false, so it
  # must be declared explicitly or the prod bundle fails to resolve it at runtime.
  "@walletconnect/ethereum-provider": ~2.21.1
  # wagmi pins @wagmi/core and @wagmi/connectors to exact versions, so these
  # three only ever move together — bumping one alone just re-duplicates the
  # tree at wagmi's pinned version.
  wagmi: ^3.7.6
  "@wagmi/core": ^3.6.4
  "@wagmi/connectors": ^8.1.0

dedupeDirectDeps: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@ensdomains/ensjs"
  - "@ensdomains/ensjs-abi"

# Only add entries here if absolutely necessary. To bypass the minimum release age for a specific package, you can temporarily include it below, run install, and then remove it.
# Note: `minimumReleaseAgeExclude` is used solely for checking new package versions.
# Once a package is added to the lockfile, it remains allowed even if newer than the minimum release age.
# minimumReleaseAgeExclude:

resolutionMode: highest

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 1 week

trustPolicyExclude:
  - "@ensdomains/ensjs"
  - "@ensdomains/ensjs-abi"

# --- Moved out of package.json's `pnpm` field, which pnpm >=11 no longer reads.
# It is ignored with only a warning, so leaving it there silently drops every
# override and patch below.

# `blockExoticSubdeps` (pnpm >=11 default: true) rejects git/tarball deps reached
# transitively. Direct deps stay allowed, so the ensjs catalog entries are fine —
# but the ensjs tarball's own manifest points at the ensjs-abi tarball, and that
# edge is a subdep. Re-pointing the override at the same tarball does not help;
# the block is on the edge, not on where the spec came from. Dropping the edge
# keeps the guard on for the rest of the tree.
#
# ensjs ships TypeScript sources that import `@ensdomains/ensjs-abi` directly, so
# the package still has to resolve at build time. It does, but through the
# hoisted fallback in `node_modules/.pnpm/node_modules` rather than through
# ensjs's own directory — which holds as long as *some* workspace project pulls
# ensjs-abi into the tree (manager, portal, e2e and four others declare it) and
# hoisting stays on. Consumers declaring it themselves would not change this:
# ensjs resolves from its virtual-store path, not from theirs. Two consequences:
# turning off `hoist` breaks every ensjs consumer, and ensjs's own version
# constraint on ensjs-abi is silently replaced by the catalog pin above, so keep
# the two catalog entries on the same pkg.pr.new build.
# Remove all of this once ensjs-abi is published to npm and ensjs depends on it
# by semver.
overrides:
  "@ensdomains/ensjs>@ensdomains/ensjs-abi": "-"
  available-typed-arrays: "npm:@socketregistry/available-typed-arrays@^1"
  es-define-property: "npm:@socketregistry/es-define-property@^1"
  for-each: "npm:@socketregistry/for-each@^1"
  function-bind: "npm:@socketregistry/function-bind@^1"
  gopd: "npm:@socketregistry/gopd@^1"
  has-property-descriptors: "npm:@socketregistry/has-property-descriptors@^1"
  has-symbols: "npm:@socketregistry/has-symbols@^1"
  has-tostringtag: "npm:@socketregistry/has-tostringtag@^1"
  hasown: "npm:@socketregistry/hasown@^1"
  indent-string: "npm:@socketregistry/indent-string@^1"
  is-arguments: "npm:@socketregistry/is-arguments@^1"
  is-core-module: "npm:@socketregistry/is-core-module@^1"
  is-generator-function: "npm:@socketregistry/is-generator-function@^1"
  is-regex: "npm:@socketregistry/is-regex@^1"
  is-typed-array: "npm:@socketregistry/is-typed-array@^1"
  isarray: "npm:@socketregistry/isarray@^1"
  object-assign: "npm:@socketregistry/object-assign@^1"
  path-parse: "npm:@socketregistry/path-parse@^1"
  safe-buffer: "npm:@socketregistry/safe-buffer@^1"
  safe-regex-test: "npm:@socketregistry/safe-regex-test@^1"
  safer-buffer: "npm:@socketregistry/safer-buffer@^1"
  set-function-length: "npm:@socketregistry/set-function-length@^1"
  string.prototype.codepointat: "npm:@socketregistry/string.prototype.codepointat@^1"
  typed-array-buffer: "npm:@socketregistry/typed-array-buffer@^1"
  which-typed-array: "npm:@socketregistry/which-typed-array@^1"
  es-set-tostringtag: "npm:@socketregistry/es-set-tostringtag@^1"
  "vite@8.0.10>rolldown": "1.0.0-rc.18"

patchedDependencies:
  xstate: patches/xstate.patch
  class-variance-authority: patches/class-variance-authority.patch
  "@rhinestone/sdk@1.8.0": patches/@rhinestone%2Fsdk@1.8.0.patch

# pnpm >=11 fails the install on any dependency build script not listed here.
# Everything is denied: esbuild, workerd, lefthook and sharp ship prebuilt
# binaries via optionalDependencies and resolve them at runtime — their install
# scripts are only a fallback downloader for when the optional dep is missing.
allowBuilds:
  "@reown/appkit": false
  core-js: false
  esbuild: false
  lefthook: false
  sharp: false
  workerd: false
